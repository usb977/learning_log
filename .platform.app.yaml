name: "ll_project"
type: "python:3.13"

relationships:
    database: "db:postgresql"

# 应用程序被暴露到网上时使用的配置
web:
    upstream:
        socket_family: unix
    commands:
        start: "gunicorn -w 4 -b unix:$SOCKET ll_project.wsgi:application"
    # 规定了请求发送的目的地
    locations:
        "/":
            passthru: true
        "/static":
            root: "static"
            expires: 1h
            allow: true

# 分配给app的永久磁盘大小：MB
disk: 512

# 设置项目运行时读写日志的目录
mounts:
    "logs":
        source: local
        source_path: logs

# 应用程序生命周期的不同时间点执行的钩子
hooks:
    build: |
        pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements_remote.txt
        
        mkdir logs
        python manage.py collectstatic
        rm -rf logs
    deploy: |
        python manage.py migrate